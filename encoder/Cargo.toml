[package]
name = "mupic-encoder"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "16 colors is all you need! MUpic video encoder for the C64 Ultimate."

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
sha2 = "0.10.9"
crc32fast = "1.5.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { version = "30.0.0", optional = true }
pollster = { version = "0.4.0", optional = true }
bytemuck = { version = "1.25.2", optional = true }

[profile.release]
debug = 0
strip = "symbols"
lto = true
codegen-units = 1
panic = "abort"
