[package]
name = "mupic-encoder"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "16 colors is all you need! MUpic video encoder for the C64 Ultimate."
default-run = "mupic-encoder"

[features]
lut-tools = []

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
sha2 = "0.10.9"
crc32fast = "1.5.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }

[build-dependencies]
sha2 = "0.10.9"

[profile.release]
debug = 0
strip = "symbols"
lto = true
codegen-units = 1
panic = "abort"
