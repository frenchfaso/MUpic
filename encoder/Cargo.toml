[package]
name = "mupic-encoder"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "16 colors is all you need! MUpic video encoder for the C64 Ultimate."

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
sha2 = "0.10.9"
crc32fast = "1.5.2"

[profile.release]
debug = 0
strip = "symbols"
lto = true
codegen-units = 1
panic = "abort"
