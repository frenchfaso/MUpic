name: Publish demo and converter
on:
  push:
    branches: [main]
    paths: ['site/**', 'media/**', 'releases/**', 'tools/build_demo.py', 'tools/package_disk.py', 'tools/stage_media.py', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - run: sudo apt-get update && sudo apt-get install -y mtools
      - run: python3 tools/build_demo.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 1
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
