<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <meta name="theme-color" content="#18182b">
  <meta name="description" content="MUpic video on the Commodore 64 Ultimate. Sixteen colors, one player, and a little movie magic.">
  <title>MUpic</title>
  <link rel="stylesheet" href="style.css?v=2c2788e5b9182da6">
  <link rel="stylesheet" href="mupic.css?v=f1abbd3acfe94a64">
</head>
<body data-preset="mupic">
  <main>
    <header class="page-title">
      <h1>MUpic</h1>
      <p class="page-subtitle">16 colors is all you need!</p>
      <nav class="project-nav" aria-label="Project">
        <span aria-current="page">Demo</span>
        <a href="convert.html">Encoder</a>
        <a href="https://github.com/frenchfaso/MUpic">GitHub</a>
      </nav>
    </header>
    <section class="emulator" aria-label="MUpic Player on Commodore 64 Ultimate">
      <div class="hardware-stage">
        <section id="display" class="screen-window" aria-label="C64 display">
          <canvas id="screen" width="384" height="272" tabindex="0" data-gamepads="0" title="Up and Down select a video; Return plays it. Space pauses or resumes; Escape returns to the list. Tap the screen to open the keyboard." aria-label="MUpic Player screen" aria-describedby="player-keys"></canvas>
          <textarea id="mobile-keyboard" class="mobile-keyboard" rows="1" inputmode="text" enterkeyhint="enter" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" tabindex="-1" aria-label="C64 keyboard" aria-describedby="player-keys"></textarea>
        </section>
        <img class="hardware-art" src="assets/monitor.svg" width="936" height="867" alt="" aria-hidden="true" draggable="false" fetchpriority="high" decoding="async">
      </div>
      <div id="mobile-player-controls" class="mobile-player-controls" aria-label="Touch player controls" hidden>
        <button class="mobile-player-key" type="button" data-player-key="ArrowUp" aria-label="Up">↑</button>
        <button class="mobile-player-key" type="button" data-player-key="ArrowDown" aria-label="Down">↓</button>
        <button class="mobile-player-key" type="button" data-player-key="Enter">Return</button>
        <button class="mobile-player-key" type="button" data-player-key="Space">Space</button>
        <button class="mobile-player-key" type="button" data-player-key="Escape">Escape</button>
        <button id="hide-mobile-keyboard" class="mobile-player-key" type="button">Hide keyboard</button>
      </div>
      <nav class="main-controls" aria-label="Player controls">
        <div class="quick-controls">
          <button id="start-c64" type="button" title="Restart MUpic Player" hidden>PLAYER</button>
        </div>
        <p id="player-keys" class="sr-only">Up and Down select a video. Return plays it. Space pauses or resumes. Escape returns to the list.</p>
      </nav>
    </section>
    <p class="tech-credit">UPIC by <a href="https://csdb.dk/release/?id=263980">Aleksi Eeben</a> · Color selection and dithering by <a href="https://bisqwit.iki.fi/story/howto/dither/jy/">Joel Yliluoma (Bisqwit)</a>.</p>
    <dialog id="player-progress" class="progress-dialog" aria-labelledby="player-progress-title" aria-describedby="runtime-status">
      <h2 id="player-progress-title">Starting player</h2>
      <p id="runtime-status" class="progress-status" role="status" aria-live="polite">Loading player…</p>
      <progress id="download-progress" max="1" aria-label="Player loading progress"></progress>
      <div class="progress-dialog-actions">
        <button id="retry-player" type="button" hidden>Retry</button>
        <button id="close-player-progress" type="button">Cancel</button>
      </div>
    </dialog>
  </main>
  <script type="module" src="app.js?v=2c8da23691e5f2b2"></script>
</body>
</html>
